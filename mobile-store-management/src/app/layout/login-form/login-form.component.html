  <form action="">
    <div class=" login-bg opacity-10 w-100 custome-height d-flex justify-content-center align-items-center ">
      <div class="border rounded bg-transparent w-25 h-50 d-flex flex-column justify-content-center align-items-center gap-4">
        <h2 class="text-primary fw-bold">Login</h2>
        <app-input
          [inputPlaceholder]="'Username'"
          [label]="'Username'"
          [(inputvalue)]="info.username">
        </app-input>
        <app-input
          [inputPlaceholder]="'Password'"
          [label]="'Password'"
          [inputType]="'password'"
          [(inputvalue)]="info.password">
        </app-input>
        <div class="d-flex justify-content-center w-100 px-3">
          <app-button
            class="btn btn-primary app-btn-save"
            [tag]="'Login'"
            (click)="onLogin()">
          </app-button>
      </div>
    </div>
    </div>
    </form>
