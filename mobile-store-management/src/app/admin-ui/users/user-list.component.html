<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Users</h5>
      <div>
        <button class="btn btn-sm btn-primary" routerLink="/admin/users/create">Create User</button>
      </div>
    </div>

    <table class="table table-hover table-sm">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{u.id}}</td>
          <td>{{u.name}}</td>
          <td>{{u.email}}</td>
          <td>{{u.role}}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" (click)="view(u)">View</button>
            <button class="btn btn-sm btn-outline-secondary me-1" (click)="edit(u)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(u)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
