<div class="d-flex justify-content-center">
  <div class="card p-4" style="max-width:420px;width:100%;">
    <h4 class="mb-3">Admin Login</h4>
    <form (ngSubmit)="submit()" [formGroup]="form" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input formControlName="email" class="form-control" placeholder="admin@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" formControlName="password" class="form-control" placeholder="••••••">
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a routerLink="/admin/forgot-password">Forgot?</a>
        <button class="btn btn-primary" [disabled]="form.invalid">Sign In</button>
      </div>
    </form>
  </div>
</div>
