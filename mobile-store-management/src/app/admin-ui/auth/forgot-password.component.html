<div class="d-flex justify-content-center">
  <div class="card p-4" style="max-width:420px;width:100%;">
    <h5 class="mb-3">Forgot Password</h5>
    <form (ngSubmit)="send()" [formGroup]="form">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input formControlName="email" class="form-control" placeholder="you@example.com">
      </div>
      <div class="d-flex justify-content-end">
        <button class="btn btn-secondary" routerLink="/admin/login">Back</button>
        <button class="btn btn-primary ms-2" [disabled]="form.invalid">Send Reset</button>
      </div>
    </form>
  </div>
</div>
