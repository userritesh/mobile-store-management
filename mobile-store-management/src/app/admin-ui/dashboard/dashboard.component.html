<div class="container-fluid">
  <div class="row g-3">
    <div class="col-12 col-md-3" *ngFor="let key of ['users','sales','stock','actions']">
      <div class="card p-3 h-100">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">{{ key | titlecase }}</div>
            <div class="h4">{{ stats[key] || 0 }}</div>
          </div>
          <div class="text-secondary">●</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12 col-lg-6">
      <div class="card p-3">
        <h6>Recent Users</h6>
        <ul class="list-group list-group-flush">
          <li class="list-group-item" *ngFor="let u of recentUsers">{{u.name}} <span class="text-muted small">({{u.email}})</span></li>
        </ul>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="card p-3">
        <h6>Recent Sales</h6>
        <table class="table table-sm mb-0">
          <thead><tr><th>Product</th><th>Qty</th><th>Total</th></tr></thead>
          <tbody>
            <tr *ngFor="let s of recentSales"><td>{{s.product}}</td><td>{{s.quantity}}</td><td>{{s.total | currency}}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12">
      <div class="card p-3">
        <h6>Stock Summary</h6>
        <div class="row">
          <div class="col-12 col-md-4" *ngFor="let s of stockSummary">
            <div class="p-2 border rounded mb-2">
              <div class="small text-muted">{{s.category}}</div>
              <div class="h5">{{s.count}} items</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
