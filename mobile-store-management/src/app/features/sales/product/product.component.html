<div class="container-fluid p-2">
  <div class="d-flex flex-column gap-4 border rounded">

    <form class="p-3" style="overflow: visible;">

      <div class="card border-1 rounded">

        <div class="d-flex justify-content-end mb-3">
          <app-button
            class="btn btn-primary app-btn-save"
            [tag]="'Save'"
            (click)="onSave()">
          </app-button>
        </div>

        <div class="row g-3 align-items-center">
          <div class="col-12 col-md-4">
            <div class="input-wrapper w-100">
              <app-input
                style="display:block; width:100% !important; min-width:0;"
                [inputPlaceholder]="'Product Name'"
                [label]="'Product Name'"
                [(inputvalue)]="selectedProduct.name">
              </app-input>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="input-wrapper w-100">
              <app-input
                style="display:block; width:100% !important; min-width:0;"
                [inputPlaceholder]="'Product Category'"
                [label]="'Product Category'"
                [(inputvalue)]="selectedProduct.productcategory">
              </app-input>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="input-wrapper w-100">
              <app-input
                style="display:block; width:100% !important; min-width:0;"
                [inputPlaceholder]="'Product Price'"
                [label]="'Product Price'"
                [(inputvalue)]="selectedProduct.price">
              </app-input>
            </div>
          </div>
        </div>

        <div class="row g-3 mt-2 align-items-center">
          <div class="col-12 col-md-4">
            <div class="input-wrapper w-100">
              <app-input
                style="display:block; width:100% !important; min-width:0;"
                [inputPlaceholder]="'Product Brand'"
                [label]="'Product brand'"
                [(inputvalue)]="selectedProduct.brand">
              </app-input>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="input-wrapper w-100">
              <app-input
                style="display:block; width:100% !important; min-width:0;"
                [inputPlaceholder]="'Product details'"
                [label]="'Product details'"
                [(inputvalue)]="selectedProduct.details">
              </app-input>
            </div>
          </div>

          <div class="col-12 col-md-4 d-flex align-items-center gap-3">
            <label class="text-primary fw-semibold mb-0">Product image</label>
            <app-image-input
              style="display:block; min-width:120px;"
              [height]="'40px'"
              [width]="'120px'"
              (fileSelected)="fileSelected($event)">
            </app-image-input>
          </div>

          <div class="col-12" *ngIf="preview">
            <div class="position-relative d-inline-block mt-2">
              <img
                [src]="preview"
                alt="Preview"
                class="preview-img"
                width="90"
                height="90">

              <app-button
                (click)="cancel()"
                [tag]="'x'"
                class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle p-0">
              </app-button>
            </div>
          </div>
        </div>
      </div>

    </form>

    <div class="mt-3 p-2">
      <app-grid [dataModel]="agGridDataModel" [rowData]="resData"></app-grid>
    </div>

  </div>
</div>
