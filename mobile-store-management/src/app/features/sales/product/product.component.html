<div class="d-flex flex-column gap-3 border p-2 rounded">
  <form class="p-2">
    <div class="d-flex flex-column gap-2 border p-2 px-3 rounded">

      <!-- Header: Buttons -->
      <div class="d-flex justify-content-end gap-2 pb-2 border-bottom">
        <app-button [tag]="'Add Item'" (click)="onAddItem()"></app-button>
        <app-button class="btn-primary" [tag]="'Save All'" (click)="onSave()"></app-button>
      </div>

      <!-- Row 1: Name, Category, Price -->
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <!-- <label for="">Product Name</label> -->
          <app-input  [label]="'Product Name'"[inputPlaceholder]="'Enter product name'" [width]="'200px'" [(inputvalue)]="selectedProduct.name">
          </app-input>
        </div>

        <div class="col-12 col-md-4">
          <!-- <label for="">Product Category</label> -->

          <app-dropdown [bindLabel]="'Product Category'" [placeholder]="'Select category'" [width]="'200px'" [searchable]="true" bindValue="id"
            [items]="dropdowndata" [(value)]="selectedProduct.productcategory">
          </app-dropdown>
        </div>

        <div class="col-12 col-md-4">
          <!-- <label>Product Price          </label> -->
          <app-input [label]="'Product Price'"[inputPlaceholder]="'0.00'" [width]="'200px'" [(inputvalue)]="selectedProduct.price">
          </app-input>
        </div>
      </div>

      <!-- Row 2: Brand, Details, Quantity -->
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <!-- <label>Product Brand</label> -->
          <app-input [label]="'Product Brand'" [inputPlaceholder]="'Enter brand name'" [width]="'200px'" [(inputvalue)]="selectedProduct.brand">
          </app-input>
        </div>

        <div class="col-12 col-md-4">
          <!-- <label for="">Product Details</label> -->
          <app-input [label]="'Product Details'" [inputPlaceholder]="'Enter product details'" [width]="'200px'"
            [(inputvalue)]="selectedProduct.details">
          </app-input>
        </div>

        <div class="col-12 col-md-4">
          <!-- <label for=""> Quantity          </label> -->
          <app-input [label]="'Quantity'" [inputPlaceholder]="'0'" [width]="'200px'" [(inputvalue)]="selectedProduct.quantity">
          </app-input>
        </div>
      </div>

      <!-- Row 3: Image Upload (full width) -->
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label text-uppercase fw-semibold"
            style="font-size:11px; letter-spacing:0.05em; color:#6b7280;">
            Product Image
          </label>
          <div ngx-dropzone
            class="uploadProductImage w-100 d-flex flex-column align-items-center justify-content-center"
            style="border: 2px dashed #c8cfd8; border-radius: 8px; min-height: 110px; background: #f8fafc; cursor: pointer;"
            [accept]="'image/jpeg,.png,.jpg,.glb,.stl/*'" (change)="fileSelected($event)">

            <ng-container *ngIf="!preview">
              <svg width="32" height="32" fill="none" stroke="#9ca3af" stroke-width="1.5" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M3 16l5-5 4 4 3-3 6 4" />
                <circle cx="8.5" cy="8.5" r="1.5" />
              </svg>
              <span style="font-size:13px; color:#9ca3af; margin-top:6px;">Click or drag to upload image</span>
            </ng-container>

            <div *ngIf="preview" class="position-relative d-inline-block">
              <img [src]="preview" alt="Preview" width="115" height="115"
                style="object-fit: cover; border-radius: 5px;" />
              <app-button (click)="cancel($event)" [tag]="'x'"
                class="btn btn-sm btn-danger position-absolute top-0 end-0 rounded-circle p-0">
              </app-button>
            </div>

          </div>
        </div>
      </div>

    </div>
  </form>
  <div>
    <app-grid [dataModel]="agGridDataModel" [rowData]="resData">
    </app-grid>
  </div>
</div>
