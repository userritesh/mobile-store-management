<div class="d-flex flex-column gap-3 border p-2 rounded">
    <form class=" p-2 ">
       
      <div class="d-flex flex-column gap-2 border p-2 px-3 rounded">
        <div class="d-flex justify-content-end pb-2"><app-button class="btn-primary" [tag]="'Save'"
            (click)="onSave()"></app-button>
        </div>
        <div class="d-flex">
          <div class="col-10">
            <div class="d-flex col-11 gap-3">
              <div class="col-12 col-md-4 form">
                <app-input [inputPlaceholder]="'Product Name'" [width]="'150px'" [label]="'Product Name'"
                  [(inputvalue)]="selectedProduct.name"></app-input>
              </div>
      
              <div class="col-12 col-md-4">
                <app-dropdown class="col-3" [placeholder]="''" [width]="'182px'" (searchable)="true"
                  [bindValue]="selectedProduct.productcategory" [bindLabel]="'Product Category'">
                </app-dropdown>
              </div>
      
              <div class="col-12 col-md-4">
                <div class="input-wrapper w-100 ">
                  <app-input [inputPlaceholder]="'Product Price'" [width]="'150px'" [label]="'Product Price'"
                    [(inputvalue)]="selectedProduct.price">
                  </app-input>
                </div>
              </div>
            </div>
      
            <div class="d-flex col-11 gap-3">
              <div class="col-12 col-md-4">
                <app-input class="col-12 col-md-4" [inputPlaceholder]="'Product Brand '"
                  [(inputvalue)]="selectedProduct.brand" [width]="'150px'" [label]="'Product brand'"></app-input>
              </div>
      
              <div class="col-12 col-md-4">
                <app-input class="col-12 col-md-4" [inputPlaceholder]="'Product details '"
                  [(inputvalue)]="selectedProduct.details" [width]="'183px'" [label]="'Product details'"></app-input>
              </div>     
                   
            </div>
          </div>
          
          <!-- <div class="col-12 col-md-4 d-flex gap-2 align-items-center">
            <label for="" class="text-primary fs-6 fw-semibold">Product image</label>
            <app-image-input [height]="'40px'" [width]="'120px'" (fileSelected)="fileSelected($event)"></app-image-input>
          
            <div *ngIf="preview" class="position-relative d-inline-block mt-2"> <img [src]="preview" alt="Preview" width="80"
                height="80" style="object-fit: cover; border-radius: 5px;">
              <app-button (click)="cancel()" [tag]="'x'"
                class=" btn btn-sm btn-danger position-absolute top-0 end-0 rounded-circle p-0 "></app-button>
            </div>
          </div> -->

          <div ngx-dropzone class=" uploadProductImage justify-content-center" [accept]="'image/jpeg,.png,.jpg,.glb,.stl/*'" (change)="fileSelected($event)">
            <label class="text-primary fs-6 fw-semibold" *ngIf="!preview">Product image</label>
                   
            <!-- Preview -->
            <div *ngIf="preview" class="position-relative d-inline-block mt-2">
              <img [src]="preview" alt="Preview" width="115" height="115" style="object-fit: cover; border-radius: 5px;" />
            
              <app-button (click)="cancel($event)" [tag]="'x'"
                class="btn btn-sm btn-danger position-absolute top-0 end-0 rounded-circle p-0">
              </app-button>
            </div>
          
          </div>
          </div>
      
      </div>
    </form>
    <div>
        <app-grid [dataModel]="agGridDataModel" [rowData]="resData">
        </app-grid>
    </div>
</div>
