<!-- 
  Stock List Component - Point of Sale UI
  
  Features:
  - Product grid display with search/filter
  - Shopping cart management
  - Category browsing
  - Add new categories
-->

<div class="sales_main" role="main" aria-label="Point of Sale">
  <div class="position-relative d-flex gap-3">
    
    <!-- ==================== LEFT SECTION: PRODUCTS ==================== -->
    <div class="left-section d-flex col-9" role="region" aria-label="Product browsing area">
      
      <div class="sticky-panel">
        <!-- Search and Filter Bar -->
        <div class="mb-3" role="search">
          <div class="row g-3 align-items-center">
            <div class="col-md-8 col-lg-10">
              <!-- Search Component for filtering products -->
              <app-search 
                (searchValue)="onSearch($event)"
                aria-label="Search products by name or category">
              </app-search>
            </div>
            <div class="col-md-4 col-lg-2">
              <!-- Filter Button - TODO: Implement filter functionality -->
              <button 
                class="btn btn-outline-secondary w-100"
                type="button"
                aria-label="Open filters"
                disabled
                title="Filter feature coming soon">
                <i class="fas fa-filter" aria-hidden="true"></i> Filter
              </button>
            </div>
          </div>
        </div>

        <!-- Point of Sale Section Header -->
        <div class="d-flex justify-content-between align-items-start  page-header">
          <div class="d-flex align-items-center gap-2 justify-content-center">
            <h4 class="text-dark fw-bold">Point of Sale</h4>
            <p class="text-muted m-0">Select products to add to cart</p>
          </div>
          <button
            class="btn btn-outline-primary btn-sm"
            type="button"
            (click)="openAddCategoryModal()"
            aria-label="Add a new stock category">
            <i class="fas fa-plus me-2" aria-hidden="true"></i>
            New Category
          </button>
        </div>
      </div>

      <div *ngIf="!showDetailView"  class="left-body overflow-auto pt-2">
        <!-- Product Cards Grid Display -->
        <div class="products-grid" role="grid" aria-label="Product list">
      
          <!-- Product Card - Repeats for each product -->
          <div *ngFor="let product of displayProducts; trackBy: trackByProductId" class="product-card" role="gridcell">
            <app-card
              [title]="product.name"
              [subtitle]="product.category"
              [price]="product.price"
              [image]="product.image"
              [payload]="product"
              [specs]="getSpecs(product)"
              (action)="addToCart($event)">
            </app-card>
          </div>
        </div>
      
        <!-- Browse Categories Section -->
        <div *ngIf="tabs && tabs.length > 0" class="mt-5 pt-4 border-top" role="region" aria-label="Stock categories">
          <h5 class="text-dark fw-bold mb-4">Browse by Category</h5>
      
          <div class="row g-3">
            <!-- Category Card - Repeats for each category -->
            <div *ngFor="let tab of tabs; trackBy: trackByCategoryName" class="col-6 col-md-4 col-lg-3">
      
              <div class="card shadow-lg rounded-3 bg-white h-100 cursor-pointer category-card"
                [routerLink]="['stockCategory']" (click)="toggleDetailView()" role="button" tabindex="0"
                (keyup.enter)="toggleDetailView()" [attr.aria-label]="'Browse ' + tab.stockcategory + ' category'">
      
                <!-- Category Image -->
                <img [src]="tab.icon_img" [alt]="tab.stockcategory + ' icon'" class="card-img-top border-bottom"
                  loading="lazy">
      
                <!-- Category Name -->
                <div class="card-body text-center">
                  <h6 class="text-primary mb-0">
                    {{ tab.stockcategory }}
                  </h6>
                </div>
              </div>
            </div>
      
          </div>
        </div>
      </div>

            <!-- ==================== DETAIL VIEW SECTION ==================== -->
  <!-- Shows category/product details when selected -->
  <div 
    *ngIf="showDetailView" 
    class="border route_space rounded p-4 pt-0 bg-white w-100 position-relative"
    role="region"
    aria-label="Detail view">
    
    <!-- Back Button -->
    <div class="back-container">
      <button 
        (click)="navigateBack()"
        class="btn btn-primary"
        type="button"
        aria-label="Go back to product list">
        ← Back
      </button>
    </div>
    
    <!-- Detail Content Container -->
    <div>
      <router-outlet></router-outlet>
    </div>
  </div>
    </div>


    <!-- ==================== RIGHT SECTION: SHOPPING CART ==================== -->
    <aside 
      class="cart-section bg-white rounded-3 shadow-lg p-4 position-sticky"
      role="complementary"
      aria-label="Shopping cart summary">
      
      <!-- Cart Header with Title and Clear Button -->
      <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
        <h5 class="mb-0">
          <i class="fas fa-shopping-cart me-2" aria-hidden="true"></i>
          Cart
          <span class="badge bg-primary ms-2" [attr.aria-label]="getCartItemCount() + ' items in cart'">
            {{ getCartItemCount() }}
          </span>
        </h5>
        
        <!-- Clear Cart Button - Only visible when cart has items -->
        <button 
          *ngIf="getCartItemCount() > 0"
          class="btn btn-link text-danger p-0"
          type="button"
          (click)="clearCart()"
          aria-label="Clear all items from cart">
          Clear
        </button>
      </div>

      <!-- Empty Cart Message -->
      <div *ngIf="getCartItemCount() === 0" class="text-center text-muted py-4">
        <i class="fas fa-inbox fa-3x mb-3 opacity-50" aria-hidden="true"></i>
        <p role="status">No items selected</p>
      </div>

      <!-- Cart Items List -->
      <div 
        *ngFor="let item of selectedItems; trackBy: trackByItemId" 
        class="cart-item mb-3 pb-3 border-bottom"
        role="listitem">
        
        <!-- Item Header: Name, Price, Remove Button -->
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <!-- Item Name -->
            <h6 class="mb-1 d-flex align-items-center gap-2">
              {{ item.name }}
              <button class="btn btn-sm btn-link p-0 show-details-btn text-primary" type="button" (click)="toggleCartItemDetails(item.id)"
                [attr.aria-label]="'Show details for ' + item.name"
                [class.fw-bold]="isCartItemDetailsOpen(item.id)">
                <small>{{ isCartItemDetailsOpen(item.id) ? 'Hide details' : 'Show details' }}</small>
              </button>
            </h6>
            <!-- Item Unit Price -->
            <p class="mb-0 text-primary fw-bold">
              ${{ item.price | number: '1.2-2' }}
            </p>
          </div>
          
          <!-- Remove Item Button -->
          <button 
            class="btn btn-sm btn-outline-danger p-0"
            type="button"
            (click)="removeFromCart(item.id)"
            [attr.aria-label]="'Remove ' + item.name + ' from cart'"
            style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        
        <!-- Quantity Controls: Decrease, Input, Increase -->
        <div class="d-flex align-items-center gap-2 justify-content-center">
          <!-- Decrease Quantity Button -->
          <button 
            class="btn btn-sm btn-outline-secondary"
            type="button"
            (click)="updateQuantity(item.id, (item.quantity || 1) - 1)"
            [attr.aria-label]="'Decrease quantity of ' + item.name">
            −
          </button>
          
          <!-- Quantity Display -->
          <input 
            type="text"
            class="form-control text-center quantity-input"
            [value]="item.quantity"
            readonly
            [attr.aria-label]="'Quantity of ' + item.name + ': ' + item.quantity">
          
          <!-- Increase Quantity Button -->
          <button 
            class="btn btn-sm btn-outline-secondary"
            type="button"
            (click)="updateQuantity(item.id, (item.quantity || 0) + 1)"
            [attr.aria-label]="'Increase quantity of ' + item.name">
            +
          </button>
        </div>

        <!-- Inline Details for Cart Item -->
        <div *ngIf="isCartItemDetailsOpen(item.id)" class="cart-item-details mt-2 text-muted small">
          <h6 class="mb-1">Specifications</h6>
          <ul *ngIf="isArray(getSpecs(item)); else cartSpecObj">
            <li *ngFor="let s of getSpecs(item)">{{ s }}</li>
          </ul>
          <ng-template #cartSpecObj>
            <div *ngIf="getSpecs(item) as spec">{{ spec }}</div>
            <div *ngIf="!getSpecs(item)" class="text-muted">No specification</div>
          </ng-template>
        </div>
      </div>

      <!-- Cart Summary and Checkout -->
      <div *ngIf="getCartItemCount() > 0" class="mt-4 pt-3 border-top">
        <!-- Total Price -->
        <div class="d-flex justify-content-between mb-3">
          <strong>Total:</strong>
          <strong class="text-primary">
            ${{ getCartTotal() | number: '1.2-2' }}
          </strong>
        </div>
        
        <!-- Proceed to Checkout Button -->
        <button 
          class="btn btn-primary w-100"
          type="button"
          [attr.aria-label]="'Proceed to checkout with cart total of $' + (getCartTotal() | number: '1.2-2')">
          Proceed to Checkout
        </button>
      </div>
    </aside>
  </div>

  
</div>
