    <form class="popupModal" >
            <div class="d-flex align-items gap-3 w-100 border-bottom">
                <h3 class="flex-grow-1 d-flex align-items-center justify-content-center m-0 p-0 ps-5 w-25">{{modalTitle}}</h3>
                <app-button (buttonOutputEvent)="close()" [buttonClass]="'buttoncss '" [buttonType]="'button'" [tag]="'X'"></app-button>
            </div>
            
    <div class="col-12 p-3 mb-3 d-flex flex-column gap-3 align-items-center">
        <app-input [inputType]="'text'" class="col-12" [inputId]="'label'" [inputName]="'label'" [(inputvalue)]="label"
            [inputPlaceholder]="'Enter Label'" [requiredField]="true" [label]="'Label'" [width]="'173px'">
        </app-input>
    
        <div *ngIf="modalTitle=='Add Product category'">
            <app-input [inputType]="'text'" [inputId]="'description'" [inputName]="'description'"
                [(inputvalue)]="description" [inputPlaceholder]="'Enter Description'" [label]="'Description'">
            </app-input>
            <app-dropdown label="Category" placeholder="Select Category" [items]="categoryList" bindLabel="name"
                bindValue="id" [(value)]="selectedCategory">
            </app-dropdown>
        </div>
        <div class="upload-section w-100">
          <ngx-dropzone
            class="upload-dropzone justify-content-center"
            [accept]="data?.isAcceptAllDoc ? '*' : 'image/jpeg,.png,.jpg'"
            [multiple]="false"
            (change)="onSelect($event)">
            <div class="upload-dropzone-content" *ngIf="!imagePreviewUrl">
              <i class="fas fa-cloud-upload-alt fa-2x" aria-hidden="true"></i>
              <h4>Click to upload or drag and drop</h4>
              <p class="text-muted">PNG, JPG up to 5MB</p>
            </div>
            <div class="upload-dropzone-content" *ngIf="imagePreviewUrl">
                <h5>Drop a new image to replace</h5>
                <i class="fas fa-plus"></i>
                <p class="text-muted">Current file: {{ selectedImageFile?.name }}</p>
            </div>
            <div *ngIf="imagePreviewUrl" class="image-preview-card mt-3">
            <img [src]="imagePreviewUrl" alt="Selected product image preview" />
            <div class="preview-meta d-flex justify-content-between align-items-center mt-2">
              <small class="text-muted">{{ selectedImageFile?.name }}</small>
              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                (click)="removeImage()"
                aria-label="Remove selected image">
                Remove
              </button>
            </div>
          </div>
          </ngx-dropzone>

          
        </div>
    </div>

       <app-button 
         class="mb-3" 
         (buttonOutputEvent)="addCard()" 
         [buttonType]="'button'" 
         [tag]="'Save'"
         [disabled]="!canSave()">
       </app-button>
    </form>
