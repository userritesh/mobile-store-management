<div class="d-flex align-items-center gap-2 mb-3 col">
  <ng-container *ngIf="label">
      <label [for]="inputId" class="fw-semibold text-primary fs-6 small  mb-0 "  [style.width]="width">{{ label }}</label>

  </ng-container>
  <input
    [type]="inputType || 'text'"
    [id]="inputId"
    [name]="inputName"
    [placeholder]="inputPlaceholder"
    [required]="requiredField"
    [(ngModel)]="inputvalue"
    (ngModelChange)="inputvalueChange.emit($event)"
    class="form-control" 
    />
</div>
