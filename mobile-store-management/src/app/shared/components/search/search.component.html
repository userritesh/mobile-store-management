<div class="search-box d-flex border rounded-3 align-items-center p-1 px-2">
  <input type="search"
         class="border-0 flex-grow-1"
         placeholder="Search here..."
         (ngModelChange)="searchValue.emit($event)"
         [(ngModel)]="searchText">

  <span class="pb-1 pe-2">|</span>

  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <circle cx="11" cy="11" r="7" stroke="black" stroke-width="2" />
    <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="black" stroke-width="2" stroke-linecap="round" />
  </svg>
</div>
