<div class="form-group p-0 d-flex gap-2 w-100">
  <label *ngIf="label" class="text-primary">{{ label }}</label>

  <ng-select 
    [items]="items"
    [bindLabel]="bindLabel"
    [bindValue]="bindValue"
    [searchable]="searchable"
    [clearable]="true"
    [placeholder]="placeholder"
    [(ngModel)]="value"
    [disabled]="disabled"
    (open)="onOpen()"
    (close)="onClose()"
    (change)="onChange($event)"
    [style.width]="width">
  </ng-select>
</div>
