<div>
   <h3 *ngIf="category">Category: {{ category }}</h3>
  <div class="row">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4" *ngFor="let p of filteredProducts">
      <div class="card p-2">
        <img [src]="p.image || p.product_image || p.src || ''" class="w-100" *ngIf="p.image || p.product_image || p.src">
        <h5 class="mt-2">{{ p.title || p.name || p.productname || p.product_title }}</h5>
        <p class="text-muted">{{ p.sku || p.id }}</p>
      </div>
    </div>
  </div>
  <p *ngIf="filteredProducts.length === 0">No products found for this category.</p>
</div>
