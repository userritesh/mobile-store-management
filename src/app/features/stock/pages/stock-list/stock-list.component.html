<div class="sales_main">
    <div class="position-relative">
        <div *ngIf="!showflag" class="gap-2 row ">

            <div *ngIf="!avilabeStockcategory" class="d-flex gap-3">
                <div *ngFor="let tab of tabs" class="col-12 col-sm-6 col-md-4 col-lg-2 mb-4 main-card"
                    style="display: flex; gap:4.5rem">
                    <div class="card_contain shadow-lg rounded-3 bg-white" (click)="stockcategory()">
                        <img [src]='tab.icon_img' class="h-75 w-100">
                        <h2 class=" text-center text-primary">{{ tab.stockcategory }}</h2>
                    </div>
                </div>
            </div>

            <div *ngIf="avilabeStockcategory">   
                <div *ngFor="let tab of tabs" class="col-12 col-sm-6 col-md-4 col-lg-2 mb-4 main-card"
                    style="display: flex; gap:4.5rem">
                    <div class="card_contain shadow-lg rounded-3 bg-white" [routerLink]="['avilabelStock']" [queryParams]="{ category: tab.stockcategory, id: tab.id }" (click)="show(tab)">
                        <img [src]='tab.icon_img' class="h-75 w-100">
                        <h2 class=" text-center text-primary">{{ tab.stockcategory }}</h2>
                    </div>
                </div>
            </div>

            <div class="plusIcon" (click)="addCard()">
                  <img src="assets/icons/plus.svg" alt="plusIcon">
            </div>
        </div>
    </div>


    <div *ngIf="showflag" class="border route_space rounded p-4 bg-white w-100  position-relative">
        <div class="back-container">
            <button (click)="back()" class="btn btn-primary  ">Back</button>
        </div>
        <div class="d-flex align-items-center justify-content-center h-100">
            <router-outlet></router-outlet>
             <div class="plusIcon" (click)="addCard()">
                  <img src="assets/icons/plus.svg" alt="plusIcon">
            </div>
        </div>
    </div>
</div>
